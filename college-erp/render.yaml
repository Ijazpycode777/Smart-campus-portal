services:
  - type: web
    name: smart-campus-portal
    runtime: node
    plan: free
    rootDir: college-erp
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: ./data/college_erp.sqlite
      - key: SESSION_SECRET
        generateValue: true