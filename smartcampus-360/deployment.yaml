# SmartCampus 360 — Kubernetes Deployment
#
# This is a documented deployment.yaml for a single-replica StatefulSet-style
# deployment on Kubernetes. SQLite is an embedded file database, so we MUST
# use a ReadWriteOnce persistent volume and exactly ONE replica. Horizontal
# scaling would require migrating to a server database (Postgres/MySQL) —
# see README.md "Scaling & SQLite" section. Do NOT scale this Deployment to
# more than one replica.

apiVersion: v1
kind: Namespace
metadata:
  name: smartcampus
  labels:
    app.kubernetes.io/name: smartcampus-360
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smartcampus-data
  namespace: smartcampus
  labels:
    app.kubernetes.io/name: smartcampus-360
spec:
  # SQLite needs ReadWriteOnce — only one pod may mount this for writes.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartcampus-360
  namespace: smartcampus
  labels:
    app.kubernetes.io/name: smartcampus-360
spec:
  replicas: 1                # DO NOT increase. SQLite is single-writer.
  strategy:
    type: Recreate            # Avoid two writers during rolling updates.
  selector:
    matchLabels:
      app.kubernetes.io/name: smartcampus-360
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartcampus-360
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: smartcampus
          image: smartcampus-360:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: smartcampus-secrets
            - configMapRef:
                name: smartcampus-config
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: smartcampus-data
        - name: uploads
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smartcampus-config
  namespace: smartcampus
data:
  NODE_ENV: production
  PORT: "4000"
  DATABASE_PATH: /app/data/smartcampus.db
  FILE_STORAGE_PATH: /app/uploads
  FRONTEND_URL: https://smartcampus.example.edu.pk
---
apiVersion: v1
kind: Secret
metadata:
  name: smartcampus-secrets
  namespace: smartcampus
type: Opaque
stringData:
  # Replace these placeholders BEFORE applying. Use kubectl create secret
  # or a sealed-secret / external-secrets operator in real environments.
  SESSION_SECRET: REPLACE_WITH_LONG_RANDOM_HEX
  SESSION_ENCRYPTION_KEY: REPLACE_WITH_BASE64_32_BYTE_KEY
  AI_API_KEY: ""
---
apiVersion: v1
kind: Service
metadata:
  name: smartcampus
  namespace: smartcampus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: smartcampus-360
  ports:
    - name: http
      port: 80
      targetPort: 4000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartcampus
  namespace: smartcampus
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - smartcampus.example.edu.pk
      secretName: smartcampus-tls
  rules:
    - host: smartcampus.example.edu.pk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smartcampus
                port:
                  name: http
