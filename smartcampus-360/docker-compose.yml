# SmartCampus 360 — Docker Compose
# A single application service with a persistent named volume for SQLite data.

services:
  smartcampus:
    build: .
    image: smartcampus-360:latest
    container_name: smartcampus-360
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      # Override these in a real deployment with strong generated secrets.
      SESSION_SECRET: ${SESSION_SECRET:-please-change-me-in-production}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-please-change-me-in-production-base32}
      DATABASE_PATH: /app/data/smartcampus.db
      FILE_STORAGE_PATH: /app/uploads
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4000}
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      # Persistent SQLite database + uploaded files survive container recreation.
      - smartcampus_data:/app/data
      - smartcampus_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  smartcampus_data:
    driver: local
  smartcampus_uploads:
    driver: local
